# Builds the application images from their source repositories, pushes them to GHCR and tells Coolify to deploy.
# The server never builds: the Nuxt build alone needs 4 GB of heap, which a small server running three databases
# does not have to spare. Images are tagged with the source commit (sha-1a2b3c4) and latest.
#
# Triggers:
#   - by hand (Actions → Images → Run workflow)
#   - from an application repository: POST /repos/HuberNicolas/infrastructure/dispatches
#     {"event_type": "build", "client_payload": {"image": "sdg-tag-heroes"}}   (see README)
#   - on changes to the Dockerfiles or the catalog in this repository

name: Images

on:
  workflow_dispatch:
    inputs:
      image:
        description: Image or stack name from images/catalog.json, or "all"
        default: all
      ref:
        description: Branch, tag or commit of the source repository
        default: main
  repository_dispatch:
    types: [build]
  push:
    branches: [main]
    paths: [images/**]

permissions:
  contents: read

concurrency:
  group: images-${{ github.event.inputs.image || github.event.client_payload.image || 'all' }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.select.outputs.images }}
      stacks: ${{ steps.select.outputs.stacks }}
    steps:
      - uses: actions/checkout@v5
      - id: select
        env:
          IMAGE: ${{ github.event.inputs.image || github.event.client_payload.image || 'all' }}
        run: |
          images=$(jq -c --arg image "$IMAGE" '[.[] | select($image == "all" or .name == $image or .stack == $image)]' images/catalog.json)
          if [ "$images" = "[]" ]; then echo "::error::Unknown image '$IMAGE'"; exit 1; fi
          echo "images=$images" >> "$GITHUB_OUTPUT"
          echo "stacks=$(jq -c '[.[].stack] | unique' <<< "$images")" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.plan.outputs.images) }}
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }}
    steps:
      - name: Check out this repository
        uses: actions/checkout@v5
        with:
          path: infrastructure

      - name: Check out ${{ matrix.image.repository }}
        uses: actions/checkout@v5
        with:
          repository: ${{ matrix.image.repository }}
          ref: ${{ github.event.inputs.ref || github.event.client_payload.ref || 'main' }}
          # Read-only token for private source repositories; public ones work without it
          token: ${{ secrets.SOURCE_REPOS_TOKEN || github.token }}
          path: source

      - name: Resolve build arguments
        id: args
        env:
          BUILD_ARGS: ${{ matrix.image.build_args }}
          DOMAIN: ${{ vars.DOMAIN }}
        run: |
          echo "sha=$(git -C source rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          echo "build_args=${BUILD_ARGS//\{\{DOMAIN\}\}/$DOMAIN}" >> "$GITHUB_OUTPUT"
          if [[ "$BUILD_ARGS" == *"{{DOMAIN}}"* && -z "$DOMAIN" ]]; then
            echo "::error::Set the repository variable DOMAIN"; exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=sha-${{ steps.args.outputs.sha }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ matrix.image.repository }}
            org.opencontainers.image.revision=${{ steps.args.outputs.sha }}

      - id: push
        uses: docker/build-push-action@v6
        with:
          context: source/${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          build-contexts: ${{ matrix.image.build_contexts }}
          build-args: ${{ steps.args.outputs.build_args }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}
          provenance: mode=max
          sbom: true

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  deploy:
    needs: [plan, build]
    runs-on: ubuntu-latest
    # Deploys only when Coolify is connected (repository variable COOLIFY_URL, secret COOLIFY_TOKEN)
    if: vars.COOLIFY_URL != ''
    strategy:
      matrix:
        stack: ${{ fromJSON(needs.plan.outputs.stacks) }}
    steps:
      - name: Deploy ${{ matrix.stack }}
        # Deploys every Coolify resource tagged with the stack name
        run: >
          curl --fail-with-body --silent --show-error
          --header "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}"
          "${{ vars.COOLIFY_URL }}/api/v1/deploy?tag=${{ matrix.stack }}"
