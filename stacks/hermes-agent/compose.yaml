# Hermes Agent (Nous Research): a personal AI agent that talks through a messenger (Telegram, Discord, Slack, …) and
# uses an online model provider (OpenRouter, OpenAI, Anthropic, Nous Portal, …). Not a public app: no domain, no
# published port. The gateway only connects outwards, to the model provider and the messenger.
#
# Isolation: the agent's tools (shell, files, browser) run inside this container only. No Docker socket and no host
# folders are mounted, and Coolify gives the stack its own network, so the agent cannot reach the other apps'
# databases. Everything it keeps (config, API keys, memory, skills) is in the volume hermes-data.
#
# Coolify: resource type "Docker Compose", this file, no domain. First setup, after the first deployment, on the
# server (the wizard asks for the model provider's key and the messenger):
#   docker exec -it $(docker ps -qf name=^hermes-) hermes setup
# then restart the resource in Coolify. Call `hermes`, not /opt/hermes/.venv/bin/hermes: the image's wrapper drops
# from root to the hermes user, so files the CLI writes stay readable for the gateway.
# If the CLI says "install state is not writable", or the gateway logs "Permission denied: /opt/data/.env" and the bot
# does not answer, files in the volume belong to root (the first start leaves its install lock to root in v0.21.6,
# and a CLI started without the wrapper writes .env and auth.json as root). Give them back and restart:
#   docker exec $(docker ps -qf name=^hermes-) chown -R hermes:hermes /opt/data
# Docs: https://github.com/NousResearch/hermes-agent

services:
  hermes:
    image: nousresearch/hermes-agent:v0.21.6
    restart: unless-stopped
    # The gateway is supervised by s6 inside the image and restarts on its own
    command: ["gateway", "run"]
    environment:
      HERMES_UID: "10000"
      HERMES_GID: "10000"
    volumes:
      - hermes-data:/opt/data
    deploy:
      resources:
        limits:
          memory: 2G

volumes:
  hermes-data:
