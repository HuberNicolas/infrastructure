# Hermes Agent (Nous Research): a personal AI agent that talks through a messenger (Telegram, Discord, Slack, …) and
# uses an online model provider (OpenRouter, OpenAI, Anthropic, Nous Portal, …). Not a public app: no domain, no
# published port. The gateway only connects outwards, to the model provider and the messenger.
#
# Concept, security model, setup and operations: docs/hermes-agent.md. In short, the agent's tools (shell, files,
# browser) run inside this container only, as a non-root user that cannot gain privileges; no Docker socket and no
# host folders are mounted; and the label below makes the host firewall (bootstrap/setup.sh, egress-guard) limit the
# container to the internet: no access to this server (SSH, Coolify) or to any private network.
#
# Coolify: resource type "Docker Compose", this file, no domain. First setup, after the first deployment:
#   docker exec -it $(docker ps -qf name=^hermes-) hermes setup
# then restart the resource in Coolify. Call `hermes`, not /opt/hermes/.venv/bin/hermes: the image's wrapper drops
# from root to the hermes user, so files the CLI writes stay readable for the gateway.

services:
  hermes:
    image: nousresearch/hermes-agent:v0.21.6
    restart: unless-stopped
    # The gateway is supervised by s6 inside the image and restarts on its own
    command: ["gateway", "run"]
    environment:
      HERMES_UID: "10000"
      HERMES_GID: "10000"
    volumes:
      - hermes-data:/opt/data
    labels:
      - infrastructure.egress=internet-only
    # setuid programs (su, mount, …) cannot raise privileges; the agent's processes run as UID 10000 without
    # capabilities. The init (s6, as root) keeps only what it needs to set up the volume and drop to the hermes user
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
      - KILL
    deploy:
      resources:
        limits:
          # Leaves the other apps 4 of the 6 cores and most of the memory, whatever the agent runs
          cpus: "2"
          memory: 2G
          pids: 512

volumes:
  hermes-data:
