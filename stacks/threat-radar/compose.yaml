# Threat Radar (private repository HuberNicolas/threat-radar): OSINT situation picture, private, work in progress.
# Contract with the repository: backend/Dockerfile serves the API on port 8000 under /api and keeps its data in /data;
# frontend/Dockerfile serves the web app with nginx on port 8080 and forwards /api/ to http://backend:8000.
# The frontend nginx asks for HTTP Basic Auth. BASIC_AUTH_USER and BASIC_AUTH_PASSWORD (plain text, hashed at
# container start) are required: without them the stack does not start, so the site never runs open by mistake.
# The Images workflow needs the secret SOURCE_REPOS_TOKEN (read access to the private repository).
#
# Coolify: resource type "Docker Compose", this file, tag threat-radar, domain
#   frontend → protocol https, domain threat-radar.<domain>, port 8080
#   environment: BASIC_AUTH_USER, BASIC_AUTH_PASSWORD

services:
  frontend:
    image: ghcr.io/hubernicolas/threat-radar-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      - SERVICE_URL_FRONTEND_8080
      - BASIC_AUTH_USER=${BASIC_AUTH_USER:?set BASIC_AUTH_USER}
      - BASIC_AUTH_PASSWORD=${BASIC_AUTH_PASSWORD:?set BASIC_AUTH_PASSWORD}
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 128M

  backend:
    image: ghcr.io/hubernicolas/threat-radar-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    expose:
      - "8000"
    volumes:
      - backend-data:/data
    deploy:
      resources:
        limits:
          memory: 1G

volumes:
  backend-data:
